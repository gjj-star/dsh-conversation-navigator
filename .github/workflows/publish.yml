name: Publish to npm

on:
  # 推送 v* 标签(如 v0.1.0)时自动发布;也可在 Actions 页手动触发
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # provenance 签名需要 id-token 权限
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # 幂等保护: 版本已发布(例如手动发过再补 tag/Release)时跳过, 避免 403 撞车
      - name: Skip if version already published
        id: skip
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view dsh-conversation-navigator@$VERSION version >/dev/null 2>&1; then
            echo "v$VERSION already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION not on npm — will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.skip.outputs.skip != 'true'
        # 幂等保护的第二道：上面用 npm view 判断"是否已发布"，但版本处于 npm 暂存处理中时
        # 还查不到，重复推同一 tag 会撞 E409（Cannot publish over previously staged version）。
        # 这类冲突按"已发布"处理，避免一次白跑的红叉。
        run: |
          set +e
          npm publish --provenance 2>&1 | tee /tmp/publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && grep -qE 'E409|EPUBLISHCONFLICT|previously staged|Cannot publish over' /tmp/publish.log; then
            echo "::notice::该版本已在 npm（或仍在暂存处理中），视为已发布，跳过"
            exit 0
          fi
          exit "$code"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
