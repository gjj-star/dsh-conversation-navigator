name: Publish to npm

on:
  # 推送 v* 标签(如 v0.1.0)时自动发布;也可在 Actions 页手动触发
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # provenance 签名需要 id-token 权限
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # 幂等保护: 版本已发布(例如手动发过再补 tag/Release)时跳过, 避免 403 撞车
      - name: Skip if version already published
        id: skip
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view dsh-conversation-navigator@$VERSION version >/dev/null 2>&1; then
            echo "v$VERSION already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION not on npm — will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.skip.outputs.skip != 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
