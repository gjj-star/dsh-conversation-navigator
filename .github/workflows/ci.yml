name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/client.js
          node --check lib/index.js
      - name: Validate screenshots.json
        run: node -e "JSON.parse(require('fs').readFileSync('screenshots.json','utf8')); console.log('screenshots.json OK')"
